<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - GymFlow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main id="registro">
        <div class="formulario">
            <img src="img/logo.png" alt="Logo de GymFlow">
            <h1>Crear cuenta</h1>
            <p>Regístrate para comenzar a usar GymFlow.</p>
            <form>

                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" autocomplete="name" minlength="2" maxlength="100" required>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" autocomplete="email" maxlength="254" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required>

                <label for="confirmar-password">Confirmar contraseña</label>
                <input type="password" id="confirmar-password" name="confirmar-password" autocomplete="new-password" minlength="8" maxlength="128" required>

                <button type="submit">Registrarse</button>

            </form>
            <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </main>
    <script src="web.js" defer></script>
</body>

</html>
