<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - GymFlow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="login">
        <div class="formulario">
            <img src="img/logo.png" alt="Logo de GymFlow">
            <h1>Iniciar sesión</h1>
            <p>Ingresa a tu cuenta de GymFlow.</p>
            <form>
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" autocomplete="email" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password" minlength="8" required>

                <button type="submit">Iniciar sesión</button>
            </form>
            <p>¿No tienes una cuenta? <a href="registro.html">Regístrate</a></p>
        </div>
    </main>
    <script src="web.js" defer></script>
</body>

</html>
