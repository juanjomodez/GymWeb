<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta - GymFlow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div>
            <img src="img/logo.png" alt="Logo de GymFlow">
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="micuenta.html">Mi cuenta</a>
        </nav>
    </header>

    <main>
        <section id="mi-cuenta">
            <h1>Mi cuenta</h1>
            <p>Bienvenido a GymFlow.</p>
            <img src="img/cuentagym.png" alt="Interior del gimnasio GymFlow">
            <div>

                <article>
                    <h2>Información personal</h2>
                    <p>Nombre: <span id="cuenta-nombre">Cargando…</span></p>
                    <p>Correo: <span id="cuenta-correo">Cargando…</span></p>
                    <button type="button" id="cerrar-sesion">Cerrar sesión</button>
                    <p id="cuenta-mensaje" role="status" aria-live="polite"></p>
                </article>

                <article>
                    <h2>Mi membresía</h2>
                    <div id="cuenta-membresia" aria-live="polite">Cargando membresía…</div>
                    <a href="index.html#planes">Ver planes</a>
                </article>

            </div>
        </section>
    </main>
    <script src="web.js" defer></script>
</body>

</html>
